[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core[pyproject]>=0.10.0",
]

[project]
name = "amd-libhipucxx"
dynamic = ["version"]
description = "Python Bindings for the Unified Communication X library (UCX) over ROCm"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "amd-hipmm=4.0.*",
]

[project.urls]
Homepage = "https://github.com/ROCm-DS/hip-ucxx"
Documentation = "https://rocm.docs.amd.com/projects/hip-ucxx/en/latest/"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.exclude = ["*tests*"]
sdist.reproducible = true
wheel.packages = ["libucxx"]
wheel.install-dir = "libucxx"
wheel.py-api = "py3"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "libucxx/VERSION"
regex = "(?P<value>.*)"

[project.entry-points."cmake.prefix"]
libucxx = "libucxx"

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI limit is 100 MiB, fail CI before we get too close to that
max_allowed_size_compressed = '75M'
