[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core[pyproject]>=0.10.0",
    "cython>=3.0.0",
]

[project]
name = "amd-hipucxx"
dynamic = ["version"]
description = "Python Bindings for the Unified Communication X library (UCX) over ROCm"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = { text = "BSD-3-Clause AND MIT" }
license-files = ["LICENSE", "NOTICE.txt"]
requires-python = ">=3.10"
dependencies = [
    "amd-libhipucxx==0.1.*",
    "numba-hip",
    "numpy>=1.23,<3.0a0",
    "amd-hipmm==4.0.*",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = [
    "cloudpickle",
    "amd-hipdf",
    "amd-cupy",
    "pytest",
    "pytest-asyncio>=1.0.0",
    "pytest-rerunfailures!=16.0.0",
]

[project.urls]
Homepage = "https://github.com/ROCm-DS/hip-ucxx"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.exclude = ["*tests*"]
sdist.reproducible = true
wheel.packages = ["ucxx"]
wheel.exclude = ["*.pyx", "CMakeLists.txt"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "ucxx/VERSION"
regex = "(?P<value>.*)"

[project.entry-points."cmake.prefix"]
ucxx = "ucxx"

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI limit is 100 MiB, fail CI before we get too close to that
max_allowed_size_compressed = '75M'

[tool.pytest.ini_options]
asyncio_mode = "auto"
